<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" class="gm-svg" data-mood="idle" role="img" aria-label="غرافي">
<style>
.gm-svg{overflow:visible}
.gm-svg *{vector-effect:none}
.gm-float{animation:gmBob 3.4s ease-in-out infinite}
@keyframes gmBob{50%{transform:translateY(-3.5px)}}
.gm-legL{transform-box:view-box;transform-origin:49px 124px;animation:gmSwL 2.8s ease-in-out infinite}
.gm-legR{transform-box:view-box;transform-origin:71px 124px;animation:gmSwR 2.8s ease-in-out infinite}
@keyframes gmSwL{50%{transform:rotate(7deg)}}
@keyframes gmSwR{50%{transform:rotate(-7deg)}}
.gm-svg.held .gm-legL,.gm-svg.held .gm-legR{animation-duration:.45s}
.gm-eyes{transform-box:view-box;transform-origin:60px 58px;animation:gmBlink 5s infinite}
@keyframes gmBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.gm-look{transition:transform .18s ease-out}
.gm-glow{transform-box:view-box;transform-origin:60px 114px;animation:gmGlow 3s ease-in-out infinite}
@keyframes gmGlow{50%{opacity:.95;transform:scale(1.12)}}
.gm-ant{animation:gmAnt 2.2s ease-in-out infinite}
@keyframes gmAnt{50%{opacity:.45}}
.gm-armR{transform-box:view-box;transform-origin:82px 94px}
.gm-svg.wave .gm-armR{animation:gmWave .5s ease-in-out 6}
@keyframes gmWave{0%,100%{transform:rotate(-135deg)}50%{transform:rotate(-105deg)}}
.gm-svg.wave .gm-armR{transform:rotate(-135deg)}
.gm-svg.spin .gm-float{animation:gmSpin .9s ease-in-out 1}
@keyframes gmSpin{to{transform:rotate(360deg)}}
.gm-svg.play .gm-moon{animation:gmToss 1.1s ease-in-out 2}
@keyframes gmToss{40%{transform:translateY(-34px) rotate(40deg)}80%{transform:translateY(0)}}
.gm-moon{transform-box:view-box;transform-origin:60px 114px}
.gm-flame{opacity:0;transform-box:view-box;transform-origin:60px 122px}
.gm-svg.fly .gm-flame{opacity:1;animation:gmFl .18s linear infinite}
@keyframes gmFl{50%{transform:scaleY(1.35) scaleX(.85)}}
.gm-mouth-o{transform-box:view-box;transform-origin:60px 70px}
.gm-svg[data-mood=talk] .gm-mouth-o{animation:gmTalk .28s ease-in-out infinite}
@keyframes gmTalk{50%{transform:scaleY(.35)}}
.gm-spark{opacity:0;transform-box:fill-box;transform-origin:center}
.gm-svg[data-mood=excited] .gm-spark{opacity:1;animation:gmSp .8s ease-in-out infinite}
.gm-spark.b{animation-delay:.25s!important}.gm-spark.c{animation-delay:.5s!important}
@keyframes gmSp{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.gm-z{opacity:0;font:700 14px sans-serif;fill:#cfc6ff}
.gm-svg[data-mood=sleep] .gm-z{opacity:1;animation:gmZ 2.4s ease-in-out infinite}
.gm-z.b{animation-delay:.8s!important}.gm-z.c{animation-delay:1.6s!important}
@keyframes gmZ{0%{transform:translate(0,6px);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
/* mood switching */
.m{display:none}
.gm-svg[data-mood=idle] .e-open,.gm-svg[data-mood=talk] .e-open,.gm-svg[data-mood=think] .e-open,.gm-svg[data-mood=surprised] .e-open,.gm-svg[data-mood=sad] .e-open,.gm-svg[data-mood=angry] .e-open,.gm-svg[data-mood=read] .e-open{display:inline}
.gm-svg[data-mood=happy] .e-happy,.gm-svg[data-mood=sleep] .e-sleep,.gm-svg[data-mood=excited] .e-star{display:inline}
.gm-svg[data-mood=surprised] .e-open{transform:scale(1.15);transform-box:view-box;transform-origin:60px 58px}
.gm-svg[data-mood=angry] .b-angry,.gm-svg[data-mood=sad] .b-sad,.gm-svg[data-mood=think] .b-think{display:inline}
.gm-svg[data-mood=idle] .mo-smile,.gm-svg[data-mood=happy] .mo-smile,.gm-svg[data-mood=read] .mo-smile,.gm-svg[data-mood=excited] .mo-big{display:inline}
.gm-svg[data-mood=talk] .mo-open,.gm-svg[data-mood=surprised] .mo-open,.gm-svg[data-mood=excited] .mo-open{display:inline}
.gm-svg[data-mood=think] .mo-flat,.gm-svg[data-mood=sleep] .mo-flat{display:inline}
.gm-svg[data-mood=sad] .mo-frown,.gm-svg[data-mood=angry] .mo-frown{display:inline}
.gm-svg[data-mood=read] .glasses{display:inline}
.gm-svg[data-mood=sad] .tear{display:inline}
.gm-svg[data-mood=think] .qmark{display:inline}
.gm-svg[data-mood=excited] .mo-open{display:none}
</style>
<defs>
<linearGradient id="gmSuit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcdde8"/><stop offset="1" stop-color="#9a9eb3"/></linearGradient>
<radialGradient id="gmHelm" cx=".34" cy=".28" r=".95"><stop offset="0" stop-color="#f1f2f9"/><stop offset=".55" stop-color="#c3c7d8"/><stop offset="1" stop-color="#8b90a8"/></radialGradient>
<linearGradient id="gmVisor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201863"/><stop offset="1" stop-color="#090620"/></linearGradient>
<radialGradient id="gmMoon" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fffbe3"/><stop offset=".6" stop-color="#f2d982"/><stop offset="1" stop-color="#c9a23f"/></radialGradient>
<radialGradient id="gmGlowG"><stop offset="0" stop-color="#ffe9a3" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/></radialGradient>
<linearGradient id="gmGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc86"/><stop offset="1" stop-color="#b8913a"/></linearGradient>
<radialGradient id="gmFlame" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></radialGradient>
</defs>
<g class="gm-float">
  <ellipse class="gm-flame" cx="60" cy="130" rx="11" ry="16" fill="url(#gmFlame)"/>
  <!-- backpack -->
  <rect x="26" y="76" width="68" height="46" rx="15" fill="#7a7d97" stroke="#2a2540" stroke-width="3"/>
  <rect x="34" y="112" width="52" height="7" rx="3.5" fill="url(#gmGold)" opacity=".9"/>
  <!-- legs -->
  <g class="gm-legL"><rect x="41" y="120" width="16" height="22" rx="8" fill="url(#gmSuit)" stroke="#2a2540" stroke-width="3"/><rect x="38" y="137" width="22" height="10" rx="5" fill="url(#gmGold)" stroke="#2a2540" stroke-width="3"/></g>
  <g class="gm-legR"><rect x="63" y="120" width="16" height="22" rx="8" fill="url(#gmSuit)" stroke="#2a2540" stroke-width="3"/><rect x="60" y="137" width="22" height="10" rx="5" fill="url(#gmGold)" stroke="#2a2540" stroke-width="3"/></g>
  <!-- body -->
  <rect x="35" y="82" width="50" height="46" rx="20" fill="url(#gmSuit)" stroke="#2a2540" stroke-width="3"/>
  <rect x="51" y="99" width="18" height="12" rx="3.5" fill="#2e2950" stroke="#2a2540" stroke-width="2"/>
  <circle cx="56" cy="105" r="2" fill="#f6dc86"/><circle cx="64" cy="105" r="2" fill="#5ad1c8"/>
  <!-- moon -->
  <g class="gm-moon">
   <circle class="gm-glow" cx="60" cy="114" r="26" fill="url(#gmGlowG)"/>
   <circle cx="60" cy="114" r="12.5" fill="url(#gmMoon)" stroke="#8a6d22" stroke-width="1.5"/>
   <circle cx="55.5" cy="110.5" r="2.6" fill="#d8b957" opacity=".75"/><circle cx="64" cy="117" r="2" fill="#d8b957" opacity=".7"/><circle cx="62" cy="108.5" r="1.3" fill="#d8b957" opacity=".7"/>
  </g>
  <!-- arms -->
  <path d="M40 94 Q31 108 49 114" fill="none" stroke="#2a2540" stroke-width="14" stroke-linecap="round"/>
  <path d="M40 94 Q31 108 49 114" fill="none" stroke="#c4c7d8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="49" cy="114" r="6.5" fill="#4a4568" stroke="#2a2540" stroke-width="2.5"/>
  <g class="gm-armR"><path d="M80 94 Q89 108 71 114" fill="none" stroke="#2a2540" stroke-width="14" stroke-linecap="round"/><path d="M80 94 Q89 108 71 114" fill="none" stroke="#c4c7d8" stroke-width="9" stroke-linecap="round"/><circle cx="71" cy="114" r="6.5" fill="#4a4568" stroke="#2a2540" stroke-width="2.5"/></g>
  <!-- ears / collar -->
  <rect x="14" y="50" width="9" height="18" rx="3.5" fill="url(#gmGold)" stroke="#2a2540" stroke-width="2.5"/>
  <rect x="97" y="50" width="9" height="18" rx="3.5" fill="url(#gmGold)" stroke="#2a2540" stroke-width="2.5"/>
  <ellipse cx="60" cy="94" rx="25" ry="7.5" fill="url(#gmGold)" stroke="#2a2540" stroke-width="3"/>
  <!-- antenna -->
  <rect x="58.2" y="6" width="3.6" height="12" rx="1.8" fill="#8b90a8" stroke="#2a2540" stroke-width="1.5"/>
  <circle class="gm-ant" cx="60" cy="5" r="4.2" fill="#ffe9a3" stroke="#b8913a" stroke-width="1.5"/>
  <!-- helmet -->
  <circle cx="60" cy="56" r="41" fill="url(#gmHelm)" stroke="#2a2540" stroke-width="3.2"/>
  <ellipse cx="60" cy="58" rx="32" ry="28" fill="url(#gmVisor)" stroke="#d9b24f" stroke-width="3.6"/>
  <path d="M38 44 Q44 35 56 33" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="34.5" cy="53" r="1.8" fill="#fff" fill-opacity=".5"/>
  <!-- face -->
  <ellipse cx="41" cy="67" rx="5.5" ry="3.2" fill="#ff8fa8" opacity=".5"/><ellipse cx="79" cy="67" rx="5.5" ry="3.2" fill="#ff8fa8" opacity=".5"/>
  <g class="gm-look" id="gmLook">
   <g class="gm-eyes">
    <g class="m e-open"><ellipse cx="49" cy="58" rx="5.4" ry="7.4" fill="#ffe9a3"/><ellipse cx="71" cy="58" rx="5.4" ry="7.4" fill="#ffe9a3"/><circle cx="50.6" cy="55" r="1.9" fill="#fff"/><circle cx="72.6" cy="55" r="1.9" fill="#fff"/></g>
    <g class="m e-happy" fill="none" stroke="#ffe9a3" stroke-width="3.4" stroke-linecap="round"><path d="M43 61 Q49 52 55 61"/><path d="M65 61 Q71 52 77 61"/></g>
    <g class="m e-sleep" fill="none" stroke="#ffe9a3" stroke-width="3.2" stroke-linecap="round"><path d="M43 58 Q49 63 55 58"/><path d="M65 58 Q71 63 77 58"/></g>
    <g class="m e-star" fill="#ffe9a3"><path d="M49 50 L51.2 56 L57 58 L51.2 60 L49 66 L46.8 60 L41 58 L46.8 56Z"/><path d="M71 50 L73.2 56 L79 58 L73.2 60 L71 66 L68.8 60 L63 58 L68.8 56Z"/></g>
   </g>
   <g class="m b-angry" stroke="#ffe9a3" stroke-width="3.2" stroke-linecap="round"><path d="M41 47 L56 52"/><path d="M79 47 L64 52"/></g>
   <g class="m b-sad" stroke="#ffe9a3" stroke-width="3" stroke-linecap="round"><path d="M42 52 L56 47"/><path d="M78 52 L64 47"/></g>
   <g class="m b-think" stroke="#ffe9a3" stroke-width="3" stroke-linecap="round"><path d="M42 46 L56 46"/></g>
   <g class="m glasses" fill="none" stroke="#f6dc86" stroke-width="2.4"><circle cx="49" cy="58" r="10"/><circle cx="71" cy="58" r="10"/><path d="M59 58 L61 58"/></g>
  </g>
  <path class="m mo-smile" d="M54 70 Q60 76 66 70" fill="none" stroke="#ffe9a3" stroke-width="3.2" stroke-linecap="round"/>
  <path class="m mo-big" d="M52 69 Q60 82 68 69Z" fill="#ff8fa8" stroke="#ffe9a3" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse class="m mo-open gm-mouth-o" cx="60" cy="71" rx="4.2" ry="4.6" fill="#ff8fa8"/>
  <path class="m mo-flat" d="M55 72 L65 72" stroke="#ffe9a3" stroke-width="3" stroke-linecap="round"/>
  <path class="m mo-frown" d="M54 74 Q60 68 66 74" fill="none" stroke="#ffe9a3" stroke-width="3.2" stroke-linecap="round"/>
  <path class="m tear" d="M41 66 q-3 5 0 7 q3 -2 0 -7z" fill="#8fd3ff"/>
  <text class="m qmark" x="90" y="36" font-size="20" font-weight="700" fill="#ffe9a3" font-family="sans-serif">?</text>
  <path class="gm-spark" d="M100 24 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffe9a3"/>
  <path class="gm-spark b" d="M16 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#fff3c4"/>
  <path class="gm-spark c" d="M104 78 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4z" fill="#ffe9a3"/>
  <text class="gm-z" x="86" y="30">z</text><text class="gm-z b" x="94" y="22">z</text><text class="gm-z c" x="102" y="14">Z</text>
</g>
</svg>
